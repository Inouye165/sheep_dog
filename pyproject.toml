[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sheepdog"
version = "0.1.0"
description = "Sheepdog Herding Lab: deterministic reinforcement-learning simulation and evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
rl = [
  "numpy>=2.0",
  "gymnasium>=1.2,<2",
  "stable-baselines3>=2.8,<3",
  "sb3-contrib>=2.8,<3",
  "tensorboard",
  "wandb",
]

[project.scripts]
sheepdog-train = "sheepdog.cli:train_command"
sheepdog-evaluate = "sheepdog.cli:evaluate_command"
sheepdog-export-demo = "sheepdog.cli:export_demo_command"
sheepdog-benchmark = "sheepdog.cli:benchmark_command"
sheepdog-server = "sheepdog.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
