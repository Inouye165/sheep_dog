<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- dark background circle -->
  <circle cx="16" cy="16" r="16" fill="#0f172a"/>
  <!-- dog silhouette: body -->
  <ellipse cx="16" cy="20" rx="7" ry="5" fill="#4ade80"/>
  <!-- head -->
  <circle cx="16" cy="13" r="4" fill="#4ade80"/>
  <!-- ear left -->
  <ellipse cx="13" cy="10.5" rx="2" ry="3" fill="#22c55e" transform="rotate(-15,13,10.5)"/>
  <!-- ear right -->
  <ellipse cx="19" cy="10.5" rx="2" ry="3" fill="#22c55e" transform="rotate(15,19,10.5)"/>
  <!-- eye left -->
  <circle cx="14.5" cy="12.5" r="0.8" fill="#0f172a"/>
  <!-- eye right -->
  <circle cx="17.5" cy="12.5" r="0.8" fill="#0f172a"/>
</svg>
